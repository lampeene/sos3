input {
  beats {
    port => 5044
    client_inactivity_timeout => 60
  }

  http {
    port => 8080
    codec => json
    type => "sos-points-http"
    threads => 4
  }
}

filter {
  if [message] =~ /^\{/ {
    json {
      source => "message"
      target => "parsed"
      skip_on_invalid_json => true
    }
    if [parsed] {
      mutate {
        rename => {
          "[parsed][level]" => "level"
          "[parsed][message]" => "log_message"
          "[parsed][requestId]" => "requestId"
          "[parsed][userId]" => "userId"
          "[parsed][service]" => "service"
          "[parsed][env]" => "app_env"
          "[parsed][version]" => "app_version"
          "[parsed][event]" => "event"
          "[parsed][httpMethod]" => "httpMethod"
          "[parsed][httpPath]" => "httpPath"
          "[parsed][statusCode]" => "statusCode"
          "[parsed][durationMs]" => "durationMs"
          "[parsed][timestamp]" => "app_timestamp"
          "[parsed][contentLength]" => "contentLength"
        }
        remove_field => ["parsed", "message"]
      }
    }
  }

  if [level] {
    mutate { lowercase => ["level"] }
  }

  if [statusCode] {
    mutate { convert => { "statusCode" => "integer" } }
  }
  if [durationMs] {
    mutate { convert => { "durationMs" => "integer" } }
  }
  if [userId] {
    mutate { convert => { "userId" => "integer" } }
  }
  if [contentLength] {
    mutate { convert => { "contentLength" => "integer" } }
  }

  mutate {
    add_field => { "[service][name]" => "sos-points-api" }
  }

  if [app_timestamp] {
    date {
      match => ["app_timestamp", "ISO8601"]
      target => "@timestamp"
      ignore_failure => true
    }
  }

  mutate {
    remove_field => ["agent", "ecs", "input", "host", "cloud", "docker"]
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOST:elasticsearch:9200}"]
    index => "sos-points-logs-%{+YYYY.MM.dd}"
    manage_template => false
    http_compression => true
    retry_initial_interval => 2
    retry_max_interval => 64
  }
}
